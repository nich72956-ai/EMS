{% extends 'base.html' %}

{% block title %}Delete Customer{% endblock %}

{% block content %}

<h1 class="mb-4">Delete Customer</h1>

<div class="card">

    <div class="card-body">

        <p>
            Are you sure you want to delete
            <strong>{{ customer.first_name }} {{ customer.last_name }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Delete
            </button>

            <a href="{% url 'customer_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
