{% extends 'base.html' %}

{% block title %}New Purchase{% endblock %}

{% block content %}

<h2 class="mb-4">New Purchase</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save Purchase
    </button>

    <a href="{% url 'purchase_list' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
