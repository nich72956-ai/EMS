<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Budtech EMS{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{
            position:fixed;
            top:0;
            left:0;
            width:250px;
            height:100vh;
            background:#212529;
            color:white;
            padding-top:20px;
        }

        .sidebar h3{
            text-align:center;
            margin-bottom:30px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:14px 25px;
            transition:.3s;
        }

        .sidebar a:hover{
            background:#0d6efd;
        }

        .content{
            margin-left:260px;
            padding:30px;
        }

        .card{
            border:none;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
            border-radius:12px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3>🏢 Budtech EMS</h3>

    <a href="/">🏠 Dashboard</a>

    <a href="{% url 'product_list' %}">
        📦 Products
    </a>

    <a href="{% url 'customer_list' %}">
        👥 Customers
    </a>

    <a href="{% url 'supplier_list' %}">
        🚚 Suppliers
    </a>

    <a href="{% url 'purchase_list' %}">
        📥 Purchases
    </a>

    <a href="{% url 'invoice_list' %}">
        🧾 Invoices
    </a>

    <a href="#">
        📊 Reports
    </a>

</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

</body>
</html>
