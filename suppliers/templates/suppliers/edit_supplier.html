
{% extends 'base.html' %}

{% block title %}Edit Supplier | BudTech EMS{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="mb-4">
        <h2>Edit Supplier</h2>
        <p class="text-muted">Update the supplier's information below.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{% url 'supplier_list' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
