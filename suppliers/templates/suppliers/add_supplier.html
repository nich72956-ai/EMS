{% extends 'base.html' %}

{% block title %}Add Supplier{% endblock %}

{% block content %}

<h2 class="mb-4">Add Supplier</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save Supplier
    </button>

    <a href="{% url 'supplier_list' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
