{% extends 'base.html' %}

{% block title %}Create Invoice{% endblock %}

{% block content %}

<h1 class="mb-4">Create Invoice</h1>

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        Invoice Details
    </div>

    <div class="card-body">

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label"><strong>Customer</strong></label>

                <select name="customer" class="form-control">

                    {% for customer in customers %}
                        <option value="{{ customer.id }}">
                            {{ customer.first_name }} {{ customer.last_name }}
                        </option>
                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label class="form-label">
                    <strong>Scan Barcode</strong>
                </label>

                <input
                    type="text"
                    id="barcode"
                    class="form-control"
                    placeholder="Scan barcode here..."
                    autofocus
                >
            </div>

            <div class="mb-3">

                <label class="form-label">
                    <strong>Product</strong>
                </label>

                <select
                    id="product"
                    name="product"
                    class="form-control">

                    {% for product in products %}

                    <option
                        value="{{ product.id }}"
                        data-barcode="{{ product.barcode }}">

                        {{ product.name }} -
                        KSh {{ product.selling_price }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    <strong>Quantity</strong>
                </label>

                <input
                    type="number"
                    name="quantity"
                    value="1"
                    min="1"
                    class="form-control"
                >

            </div>

            <button class="btn btn-success">
                Save Invoice
            </button>

            <a href="{% url 'invoice_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

    const barcode = document.getElementById("barcode");
    const product = document.getElementById("product");

    barcode.focus();

    barcode.addEventListener("change", function(){

        let code = barcode.value.trim();

        for(let i=0;i<product.options.length;i++){

            if(product.options[i].dataset.barcode === code){

                product.selectedIndex = i;

                document.querySelector("input[name='quantity']").focus();

                return;
            }

        }

        alert("Product not found.");

        barcode.select();

    });

});

</script>

{% endblock %}
